name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # 允许手动触发
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 缓存 Gradle 依赖（加速后续构建）
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. 从 Gradle 官方 CDN 下载 8.6，生成 wrapper（含 gradle-wrapper.jar）
      - name: Install Gradle 8.6 and generate wrapper
        run: |
          GRADLE_VERSION="8.6"
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -O /tmp/gradle-${GRADLE_VERSION}.zip
          unzip -q /tmp/gradle-${GRADLE_VERSION}.zip -d /tmp/gradle-install
          export GRADLE_HOME="/tmp/gradle-install/gradle-${GRADLE_VERSION}"
          export PATH="${GRADLE_HOME}/bin:${PATH}"
          gradle --version
          gradle wrapper --gradle-version ${GRADLE_VERSION}
          chmod +x gradlew
          echo "${GRADLE_HOME}/bin" >> $GITHUB_PATH

      # 5. 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 6. 列出生成的 APK（用于调试确认路径）
      - name: List generated APKs
        run: find app/build/outputs/apk -name "*.apk" | sort

      # 7. 上传 APK 到 Artifacts（每次构建可在 Actions 页下载）
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QiyuanLauncher-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # ── 可选：打 Tag 时自动发布 Release ───────────────────────────────────────────
  release:
    name: Release APK on Tag
    runs-on: ubuntu-latest
    # 仅在推送 v*.*.* 格式的 tag 时触发
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Gradle 8.6 and generate wrapper
        run: |
          GRADLE_VERSION="8.6"
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -O /tmp/gradle-${GRADLE_VERSION}.zip
          unzip -q /tmp/gradle-${GRADLE_VERSION}.zip -d /tmp/gradle-install
          export GRADLE_HOME="/tmp/gradle-install/gradle-${GRADLE_VERSION}"
          export PATH="${GRADLE_HOME}/bin:${PATH}"
          gradle wrapper --gradle-version ${GRADLE_VERSION}
          chmod +x gradlew
          echo "${GRADLE_HOME}/bin" >> $GITHUB_PATH

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          name: "QiyuanLauncher ${{ github.ref_name }}"
          body: |
            ## 启源车机桌面 ${{ github.ref_name }}

            ### 安装说明
            1. 下载下方 APK 文件
            2. 使用 `adb install -r QiyuanLauncher-*.apk` 安装到车机
            3. 或通过车机文件管理器直接安装

            > **注意**：需使用车机平台签名或厂商授权签名方可获取完整 SDK 权限。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
